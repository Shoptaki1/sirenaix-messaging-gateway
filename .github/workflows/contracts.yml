name: Gateway API contracts

on:
  push:
    paths:
      - "internal/gateway/httpapi/**"
      - ".github/workflows/contracts.yml"
  pull_request:
    paths:
      - "internal/gateway/httpapi/**"
      - ".github/workflows/contracts.yml"

env:
  GOTOOLCHAIN: local

permissions:
  contents: read

jobs:
  openapi-contract:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: true

      - name: Validate OpenAPI schema and route parity
        run: go test -count=1 ./internal/gateway/httpapi -run '^TestOpenAPI'
