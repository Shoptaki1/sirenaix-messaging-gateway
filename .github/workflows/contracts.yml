name: Gateway API contracts

on:
  push:
    paths:
      - "internal/gateway/httpapi/**"
      - ".github/workflows/contracts.yml"
  pull_request:
    paths:
      - "internal/gateway/httpapi/**"
      - ".github/workflows/contracts.yml"

env:
  GOTOOLCHAIN: local

permissions:
  contents: read

jobs:
  openapi-contract:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.6"
          cache: true

      - name: Validate OpenAPI schema and route parity
        run: go test -count=1 ./internal/gateway/httpapi -run '^TestOpenAPI'
