name: Gateway release

on:
  push:
    tags:
      - "v*"

env:
  GOTOOLCHAIN: local

permissions:
  contents: read

concurrency:
  group: "gateway-release-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  unit-race:
    name: Unit and messaging lifecycle race tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.6"
          cache: true

      - name: Install libolm for race-enabled builds
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libolm-dev libolm3

      - name: Run production gateway unit tests
        run: >-
          go test -count=1
          ./internal/gateway/...
          ./pkg/libgm/...
          ./cmd/sirenaix-gateway

      - name: Run messaging lifecycle race tests
        run: >-
          go test -race -count=1
          ./internal/gateway/app
          ./internal/gateway/connectionactor
          ./internal/gateway/ingress
          ./internal/gateway/kafka
          ./internal/gateway/media/...
          ./internal/gateway/messaging
          ./internal/gateway/provider/gmessages
          ./internal/gateway/webhook
          ./pkg/libgm

  postgres-integration:
    name: Live PostgreSQL integration tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_DB: sirenaix_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sirenaix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.6"
          cache: true

      - name: Run gateway PostgreSQL integration suite
        env:
          SIRENAIX_POSTGRES_TEST_DSN: postgres://postgres:postgres@localhost:5432/sirenaix_test?sslmode=disable
        run: >-
          go test -count=1 -tags=postgres_integration
          ./internal/gateway/store/postgres
          ./internal/gateway/app
          ./internal/gateway/provider/gmessages
          -run TestPostgresIntegration

  contracts:
    name: OpenAPI contract and route parity
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.6"
          cache: true

      - name: Validate OpenAPI schema and route parity
        run: go test -count=1 ./internal/gateway/httpapi -run '^TestOpenAPI'

  workflow-policy:
    name: Workflow syntax and supply-chain policy
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.6"
          cache: true

      - name: Install pinned workflow validator
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Validate every workflow
        run: actionlint

      - name: Test release publication outside a Git checkout
        run: ./scripts/test-publish-release

      - name: Enforce repository workflow policy
        run: go test ./internal/gateway/app -run '^TestCISupplyChainPolicy$'

  secrets:
    name: Full-history credential scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out complete tagged history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.6"
          cache: true

      - name: Install pinned gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.28.0

      - name: Scan every reachable commit with reviewed fingerprints
        run: gitleaks git --redact=100 --no-banner --ignore-gitleaks-allow --log-opts="--all" .

  licenses:
    name: Gateway dependency license distribution
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.6"
          cache: true

      - name: Install pinned license classifier
        run: go install github.com/google/go-licenses@v1.6.0

      - name: Audit dependency licenses and committed bundle
        run: ./scripts/check-licenses

  vulnerabilities:
    name: Reachable Go vulnerability scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.6"
          cache: true

      - name: Install pinned govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: Scan the production gateway command
        run: govulncheck ./cmd/sirenaix-gateway

  container:
    name: Container hardening, vulnerability, and SBOM gates
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build tagged gateway image
        run: >-
          docker build --pull --file Dockerfile
          --tag "sirenaix-gateway:${GITHUB_SHA}"
          --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          --label "org.opencontainers.image.revision=${GITHUB_SHA}"
          --label "org.opencontainers.image.licenses=AGPL-3.0-or-later"
          .

      - name: Verify runtime and license-distribution contract
        run: ./scripts/verify-container "sirenaix-gateway:${GITHUB_SHA}"

      - name: Block actionable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.72.0
          scan-type: image
          image-ref: "sirenaix-gateway:${{ github.sha }}"
          scanners: vuln
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: 1
          cache: false

      - name: Generate CycloneDX image SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.72.0
          scan-type: image
          image-ref: "sirenaix-gateway:${{ github.sha }}"
          scanners: vuln
          format: cyclonedx
          output: sirenaix-gateway.cdx.json
          exit-code: 0
          cache: false

      - name: Confirm SBOM output
        run: test -s sirenaix-gateway.cdx.json

  build:
    name: Build deterministic release archives
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.26.6"
          cache: true

      - name: Build deterministic Linux archives
        shell: bash
        run: |
          set -euo pipefail
          export CGO_ENABLED=0
          export SOURCE_DATE_EPOCH
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          version=${GITHUB_REF_NAME#v}
          mkdir -p dist stage release-tools
          cp scripts/publish-release release-tools/publish-release
          for architecture in amd64 arm64; do
            archive="sirenaix-messaging-gateway_${version}_linux_${architecture}"
            rm -rf "stage/${archive}"
            mkdir -p "stage/${archive}"
            GOOS=linux GOARCH="$architecture" go build \
              -trimpath -buildvcs=true -ldflags='-s -w' \
              -o "stage/${archive}/sirenaix-gateway" \
              ./cmd/sirenaix-gateway
            cp LICENSE NOTICE.md "stage/${archive}/"
            cp -R third_party "stage/${archive}/"
            tar --sort=name \
              --mtime="@${SOURCE_DATE_EPOCH}" \
              --owner=0 --group=0 --numeric-owner \
              -C stage -czf "dist/${archive}.tar.gz" "${archive}"
          done
          (
            cd dist
            LC_ALL=C sha256sum ./*.tar.gz | sort -k2 > checksums.txt
          )

      - name: Upload unsigned release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unsigned-release-bundle
          path: |
            dist/
            release-tools/
          if-no-files-found: error
          retention-days: 7

  provenance:
    name: Attest and keyless-sign checksums
    needs:
      - build
      - unit-race
      - postgres-integration
      - contracts
      - workflow-policy
      - secrets
      - licenses
      - vulnerabilities
      - container
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download unsigned release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unsigned-release-bundle
          path: .

      - name: Verify release checksums before signing
        run: |
          cd dist
          sha256sum --check checksums.txt

      - name: Generate GitHub build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            dist/*
            release-tools/publish-release

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Keyless-sign and verify checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          cosign sign-blob --yes --bundle dist/checksums.txt.sigstore.json dist/checksums.txt
          cosign verify-blob \
            --bundle dist/checksums.txt.sigstore.json \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/.+$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            dist/checksums.txt

      - name: Upload signed release bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signed-release-bundle
          path: |
            dist/
            release-tools/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish protected tagged release
    needs:
      - build
      - unit-race
      - postgres-integration
      - contracts
      - workflow-policy
      - secrets
      - licenses
      - vulnerabilities
      - container
      - provenance
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - name: Download signed release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-release-bundle
          path: .

      - name: Verify release checksums before publication
        run: |
          cd dist
          sha256sum --check checksums.txt

      - name: Confirm owner-managed repository release controls
        env:
          RELEASE_CONTROLS_ACKNOWLEDGED: ${{ vars.SIRENAIX_RELEASE_CONTROLS_ACKNOWLEDGED }}
        run: |
          if [ "${RELEASE_CONTROLS_ACKNOWLEDGED}" != "true" ]; then
            echo "release environment, protected tag, and immutable-release prerequisites are not acknowledged" >&2
            exit 1
          fi

      - name: Publish GitHub release without a Git checkout
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: sh release-tools/publish-release dist
