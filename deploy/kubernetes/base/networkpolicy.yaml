apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sirenaix-gateway
spec:
  podSelector:
    matchLabels:
      sirenaix.ai/network-restricted: "true"
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              sirenaix.ai/gateway-client: "true"
      ports:
        - protocol: TCP
          port: 8443
    - from:
        - podSelector:
            matchLabels:
              sirenaix.ai/ops-client: "true"
      ports:
        - protocol: TCP
          port: 9090
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 5432
    - ports:
        - protocol: TCP
          port: 443
