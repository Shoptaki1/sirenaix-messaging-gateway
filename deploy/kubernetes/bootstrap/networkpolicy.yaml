apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sirenaix-gateway-migration-jobs
spec:
  podSelector:
    matchLabels:
      sirenaix.ai/migration-network-restricted: "true"
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 5432
