apiVersion: batch/v1
kind: Job
metadata:
  name: sirenaix-gateway-migrate
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sirenaix-gateway-migrate
        sirenaix.ai/migration-network-restricted: "true"
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: registry.invalid/sirenaix-gateway:REQUIRED_IMMUTABLE_RELEASE_IMAGE
          imagePullPolicy: IfNotPresent
          args: ["migrate", "up"]
          env:
            - name: SIRENAIX_MIGRATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sirenaix-gateway-migration
                  key: database-url
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
